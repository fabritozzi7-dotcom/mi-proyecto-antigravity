name: Keep Alive - Streamlit App

on:
  schedule:
    # Cada 12 horas (00:00 y 12:00 UTC). Streamlit Cloud duerme apps tras ~7 días
    # de inactividad, así que con 2 pings diarios queda con margen amplio.
    - cron: "0 0,12 * * *"
  workflow_dispatch: # Ejecucion manual desde GitHub

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Visit app and click wake-up button if dormant
        run: |
          node -e "
          const { chromium } = require('playwright');
          const URL = 'https://expoconsult-rendiciones.streamlit.app';
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              await page.goto(URL, { waitUntil: 'networkidle', timeout: 60000 });
              const wakeBtn = page.locator('button:has-text(\"Yes, get this app back up\")');
              if (await wakeBtn.count() > 0) {
                console.log('App was dormant — clicking wake-up button');
                await wakeBtn.click();
                // Esperar a que arranque (Streamlit tarda ~30-60s en levantar)
                await page.waitForTimeout(60000);
                console.log('Wake-up triggered');
              } else {
                console.log('App is already awake');
              }
            } catch (err) {
              console.error('Error visiting app:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          "
