name: Keep Alive - Streamlit App

on:
  schedule:
    # Todos los dias a las 08:00 AM UTC
    - cron: "0 8 * * *"
  workflow_dispatch: # Permite ejecucion manual desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -sSf --max-time 30 https://expoconsult-rendiciones.streamlit.app > /dev/null
